name: Frontend CI
on:
  push:
    branches: [main]
    paths: ["frontend/**", "landing/**", "pwa/**", "tools/build-static.mjs", "vercel.json", ".vercelignore", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", "landing/**", "pwa/**", "tools/build-static.mjs", "vercel.json", ".vercelignore", ".github/workflows/frontend-ci.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and proxy tests
        working-directory: frontend
        run: |
          node --check assets/app.js
          node --check assets/design.js
          node --check assets/motion.js
          node --check assets/api-config.js
          node --check assets/api-client.js
          node --check ../landing/assets/landing.js
          node --check ../pwa/service-worker.js
          node --check ../pwa/register.js
          node --check ../pwa/offline.js
          node ../tools/build-static.mjs
          node --test tests/*.test.mjs
